name: Release

# Push a tag to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Everything is built on GitHub's runners, so no Linux machine is needed to
# produce Linux packages. Run it manually from the Actions tab first
# (workflow_dispatch) to check the builds before attaching anything to a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Only tag pushes and manual dispatch trigger this (not every push/PR), so the
# main case this actually guards against is re-running workflow_dispatch
# repeatedly while iterating — cheap to have either way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  LIBVLC_VERSION: 3.0.21

jobs:
  # Compiles core/ once; linux-deb/linux-rpm/linux-appimage each package the
  # same staged output as their own parallel, independently-failing job
  # instead of one job doing all three in sequence — a .deb-only failure no
  # longer hides whether .rpm/AppImage also would have worked, and none of
  # the three need to wait on each other or re-run the C++ compile.
  linux-build:
    name: Linux (build)
    # Deliberately not ubuntu-latest: an AppImage runs on any glibc at least
    # as new as the one it was built against, so building on the oldest
    # supported runner is what makes it work on older distributions too —
    # matters here since linux-appimage reuses this job's staged output.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # DISCORD_CLIENT_ID is an optional repo secret. CMake reads .env at
      # configure time (core/CMakeLists.txt) and only enables Discord Rich
      # Presence when it finds a non-empty value — an unset secret makes this
      # write an empty line, which is the same as no .env at all.
      - name: Write .env
        run: echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" > .env

      # Ubuntu 22.04's own qt6-base-dev is 6.2.4, below the 6.5 floor
      # core/CMakeLists.txt requires, and (checked against a real run) the
      # kubuntu-ppa/backports PPA does not actually carry a newer qt6-base-dev
      # for jammy — it backports KDE Plasma/Frameworks, not raw Qt6 base, so
      # apt silently keeps resolving to the stock 6.2.4 package even with the
      # PPA enabled. install-qt-action sidesteps distro packaging entirely,
      # same as the Windows job already does.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwayland
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libvlc-dev vlc-plugin-base \
            libsecret-1-dev \
            libtesseract-dev tesseract-ocr tesseract-ocr-eng \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-release

      - name: Build
        env:
          SEGMENTER_CMAKE_EXTRA_ARGS: >-
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: |
          chmod +x linux/native/build.sh
          ./linux/native/build.sh

      # A binary that builds but will not start is worse than a failed build,
      # and both failure modes here are silent — a missing platform plugin
      # only surfaces at runtime.
      - name: Smoke-test the binary
        run: QT_QPA_PLATFORM=offscreen linux/native/build/Release/bin/Segmenter --scan /nonexistent | tail -1

      # Staged once here via the install() rules in CMakeLists.txt, so
      # linux-deb/linux-rpm/linux-appimage need neither cmake nor the Qt/
      # libvlc build environment above — just their own packaging tool.
      - name: Stage install tree
        run: |
          DESTDIR="${{ github.workspace }}/stage" \
            cmake --install linux/native/build/Release --prefix /usr

      - uses: actions/upload-artifact@v4
        with:
          name: linux-staged
          path: stage/
          if-no-files-found: error

  linux-deb:
    name: Linux (.deb)
    needs: linux-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-staged
          path: stage

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev fakeroot

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "${GITHUB_REF_NAME}" ] && VERSION="1.0.0"
          chmod +x linux/native/package.sh
          ./linux/native/package.sh --only deb --version "${VERSION}" \
            --staged-dir "${{ github.workspace }}/stage"

      - name: Smoke-test the package
        run: dpkg-deb -c linux/native/dist/*.deb | grep -q '/usr/bin/Segmenter'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          # PKGBUILD rides along here (package.sh always copies it into dist/
          # regardless of --only — see its own comment) since some job has to
          # upload it and this one is as good as any; it's a recipe rather
          # than a built package, but the one Arch users actually want.
          path: |
            linux/native/dist/*.deb
            linux/native/dist/PKGBUILD
          if-no-files-found: error

  linux-rpm:
    name: Linux (.rpm)
    needs: linux-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-staged
          path: stage

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "${GITHUB_REF_NAME}" ] && VERSION="1.0.0"
          chmod +x linux/native/package.sh
          ./linux/native/package.sh --only rpm --version "${VERSION}" \
            --staged-dir "${{ github.workspace }}/stage"

      # Ubuntu can't install an .rpm to actually run it — just check rpmbuild
      # produced one with the files it should have.
      - name: Smoke-test the package
        run: rpm -qlp linux/native/dist/*.rpm | grep -q '/usr/bin/Segmenter'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: linux/native/dist/*.rpm
          if-no-files-found: error

  linux-appimage:
    name: Linux (AppImage)
    needs: linux-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-staged
          path: stage

      # linuxdeploy resolves and bundles the staged binary's actual shared
      # library dependencies (libvlc, libsecret, libtesseract, Qt itself,
      # ...), so unlike linux-deb/linux-rpm this job needs the same runtime
      # libraries present as linux-build did, plus Qt's own tools —
      # linuxdeploy-plugin-qt shells out to qmake to find Qt's plugin layout.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwayland
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvlc-dev vlc-plugin-base libsecret-1-dev libtesseract-dev \
            desktop-file-utils libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libgl1 file curl

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "${GITHUB_REF_NAME}" ] && VERSION="1.0.0"
          chmod +x linux/native/package.sh
          ./linux/native/package.sh --only appimage --version "${VERSION}" \
            --staged-dir "${{ github.workspace }}/stage"

      - name: Smoke-test the bundle
        run: |
          set -e
          APPIMAGE="$(ls linux/native/dist/*.AppImage)"
          chmod +x "${APPIMAGE}"
          env -u QT_PLUGIN_PATH -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen \
            "${APPIMAGE}" --appimage-extract-and-run --scan /nonexistent | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: linux/native/dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Linux (Flatpak)
    runs-on: ubuntu-24.04
    # Compiles ffmpeg and libvlc from source inside the sandbox — the slowest
    # job in this workflow by a wide margin, and the newest/least battle-tested
    # packaging format here. continue-on-error plus the `if` guards below on
    # the release job mean a flatpak-builder failure never blocks shipping the
    # .deb/.rpm/AppImage/Windows build; it just ships without this one format.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          # elfutils: flatpak-builder's debuginfo-extraction step shells out to
          # eu-strip, which isn't pulled in by flatpak-builder itself.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      # flatpak-builder skips rebuilding a module whose cached build state is
      # still valid — this is what turns the ffmpeg/libvlc compile (the
      # slowest thing in this whole workflow) into a no-op on a cache hit.
      # Keyed on dev.lynder.Segmenter.yml specifically (not
      # segmenter-module*.yml) because that's the file that actually defines
      # the ffmpeg/libvlc/libsecret modules; editing the segmenter module
      # itself shouldn't invalidate their cached builds.
      - uses: actions/cache@v4
        with:
          path: linux/native/flatpak/.flatpak-builder
          key: flatpak-builder-${{ hashFiles('linux/native/flatpak/dev.lynder.Segmenter.yml') }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${VERSION}" = "${GITHUB_REF_NAME}" ] && VERSION="1.0.0"
          chmod +x linux/native/flatpak/build.sh
          # --local-source: build this checkout's commit, not main — a tag push
          # and its HEAD are usually the same commit, but relying on that would
          # make a workflow_dispatch run silently build whatever main currently
          # is instead of the ref actually being tested.
          linux/native/flatpak/build.sh --version "${VERSION}" --local-source

      - name: Smoke-test the bundle
        run: |
          set -e
          BUNDLE="$(ls linux/native/dist/*.flatpak)"
          flatpak install --noninteractive --user "${BUNDLE}"
          QT_QPA_PLATFORM=offscreen flatpak run dev.lynder.Segmenter --scan /nonexistent | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: linux/native/dist/*.flatpak
          if-no-files-found: error

  windows:
    name: Windows (Qt 6 / C++)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # See the Linux job's "Write .env" step — same optional-secret handling.
      - name: Write .env
        shell: pwsh
        run: "Set-Content -Path .env -Value \"DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}\""

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # dir: C:\Qt because that is one of the fixed locations
      # windows/native/build.ps1 searches (SEGMENTER_QT_ROOT is the escape
      # hatch for anywhere else) — install-qt-action's own default install
      # location doesn't match it, which is what "Qt 6 (msvc2022_64) not
      # found" from build.ps1 actually means.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: 'C:\Qt'
          cache: true

      # The LibVLC SDK is not committed to the repository. The NuGet package is
      # a plain zip containing headers, import libraries, the DLLs and the
      # plugin tree, which is exactly the layout CMake expects.
      - name: Fetch LibVLC SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://www.nuget.org/api/v2/package/VideoLAN.LibVLC.Windows/${{ env.LIBVLC_VERSION }}" `
            -OutFile libvlc.zip
          Expand-Archive libvlc.zip -DestinationPath libvlc_pkg -Force

          $src = "libvlc_pkg/build/x64"
          $vlc = "windows/native/third_party/vlc"
          New-Item -ItemType Directory -Force -Path "$vlc/sdk/include","$vlc/sdk/lib" | Out-Null
          Copy-Item "$src/include/*" "$vlc/sdk/include/" -Recurse -Force
          Copy-Item "$src/libvlc.lib","$src/libvlccore.lib" "$vlc/sdk/lib/" -Force
          Copy-Item "$src/libvlc.dll","$src/libvlccore.dll" "$vlc/" -Force
          Copy-Item "$src/plugins" "$vlc/plugins" -Recurse -Force
          foreach ($opt in 'hrtfs','lua') {
            if (Test-Path "$src/$opt") { Copy-Item "$src/$opt" "$vlc/$opt" -Recurse -Force }
          }

      - name: Build
        shell: pwsh
        run: ./windows/native/build.ps1 -Configuration Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path windows/native/dist/* `
            -DestinationPath artifacts/Segmenter-windows-x64.zip -Force
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS (Swift / VLCKit)
    # arm64 runner; swift build cross-compiles the x86_64 slice from the same
    # Xcode SDK rather than needing actual Intel hardware.
    runs-on: macos-14
    # Untested in CI so far — the native macOS build has only ever been run
    # locally by the maintainer. continue-on-error means a build-environment
    # surprise here does not block shipping Linux/Windows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build
        run: |
          chmod +x mac/native/build.sh
          ./mac/native/build.sh

      - name: Smoke-test the app bundle
        run: |
          set -e
          file mac/native/dist/Segmenter.app/Contents/MacOS/Segmenter
          lipo -info mac/native/dist/Segmenter.app/Contents/MacOS/Segmenter

      - name: Package
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            mac/native/dist/Segmenter.app artifacts/Segmenter-macos-universal.zip
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux-deb, linux-rpm, linux-appimage, windows, flatpak, macos]
    runs-on: ubuntu-latest
    # Manual runs build and upload artifacts but deliberately stop short of
    # publishing, so the workflow can be exercised without cutting a release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: true
          generate_release_notes: true
          body: |
            ## Installation

            | Platform | File |
            |---|---|
            | Debian / Ubuntu / Mint | `segmenter_*_amd64.deb` — `sudo apt install ./segmenter_*.deb` |
            | Fedora / RHEL / openSUSE | `segmenter-*.x86_64.rpm` — `sudo dnf install ./segmenter-*.rpm` |
            | Arch / Manjaro | `PKGBUILD` — drop it in a directory and run `makepkg -si` |
            | Sandboxed, any distro | `Segmenter-*-x86_64.flatpak` — `flatpak install ./Segmenter-*.flatpak` |
            | Any Linux (no install) | `Segmenter-*-x86_64.AppImage` — `chmod +x` and run |
            | Windows 10/11 x64 | `Segmenter-windows-x64.zip` — unzip and run `Segmenter.exe` |
            | macOS 12+ (Apple Silicon + Intel) | `Segmenter-macos-universal.zip` — unzip and run; unsigned, so right-click → Open the first time |

            The AppImage bundles Qt and needs no installation; the Flatpak is
            fully sandboxed and bundles its own ffmpeg/libvlc; the `.deb`/`.rpm`
            are smaller because they use the Qt and VLC your distribution
            already ships.

            `ffmpeg` and `ffprobe` must be on `PATH` for the frame strip, the
            waveform and RCD scanning (the Flatpak already bundles them):
            `sudo apt install ffmpeg` / `sudo dnf install ffmpeg-free` /
            `winget install Gyan.FFmpeg`.

            Optional on Linux (already included in the Flatpak): `libsecret-1-0`
            /`libsecret` stores API keys in your keyring instead of a
            permission-restricted file, and `tesseract-ocr-eng`/
            `tesseract-langpack-eng` enables the visual pass that tells closing
            credits from a preview.
